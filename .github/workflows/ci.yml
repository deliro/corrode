---
on:
  push:
    branches:
      - main
  pull_request:

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Build packages
        run: uv build

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import corrode; assert corrode.Ok(1).unwrap() == 1"

      - name: Build docs
        run: uv run --locked --group docs mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.15"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
    name: Python ${{ matrix.python }}
    env:
      # uv skips prerelease interpreters unless asked for one explicitly
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      # Coverage is collected on 3.14 (newest stable); 3.15 is a prerelease
      - name: Run tests
        run: uv run pytest ${{ matrix.python == '3.14' && '--cov=corrode --cov-report=xml' || '' }}

      # fail_ci_if_error defaults to false, which let a rejected upload
      # ("Token required - not valid tokenless upload") pass as a green build
      # while the coverage badge sat at "unknown". A broken upload is a broken
      # build: errors should never pass silently.
      - name: Upload coverage to codecov.io
        uses: codecov/codecov-action@v7
        if: matrix.python == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - checker: mypy
            run: >
              uv run mypy
              && uv run mypy --python-version 3.11
              && uv run mypy --python-version 3.11 tests/type_checking/typesafety.py
              && uv run mypy --python-version 3.15 tests/type_checking/typesafety.py
          - checker: basedpyright
            run: >
              uv run --with basedpyright basedpyright --pythonversion 3.11
              && uv run --with basedpyright basedpyright --pythonversion 3.15
          - checker: ty
            run: >
              uv run --with ty ty check --python-version 3.11 src/corrode/ tests/type_checking/typesafety.py
              && uv run --with ty ty check --python-version 3.15 src/corrode/ tests/type_checking/typesafety.py
          - checker: pyrefly
            run: >
              uv run --with pyrefly pyrefly check --preset strict --python-version 3.11 src/corrode/ tests/type_checking/typesafety.py
              && uv run --with pyrefly pyrefly check --preset strict --python-version 3.15 src/corrode/ tests/type_checking/typesafety.py
    name: typecheck / ${{ matrix.checker }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ${{ matrix.checker }}
        run: ${{ matrix.run }}
